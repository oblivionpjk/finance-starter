# 云服务器部署预留：docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # 离线快照只读挂载；在线数据源可不挂
      - ../data/raw:/app/data/raw:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 需要域名 / HTTPS / 上传体积限制时启用
  nginx:
    image: nginx:1.27-alpine
    profiles: ["with-nginx"]
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
