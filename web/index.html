<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>财务分析系统</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <div>
      <h1>财务分析系统</h1>
      <p class="sub">输入 6 位 A 股代码，或上传三大报表，生成 PDF 财务分析报告与数据分析图</p>
    </div>
    <div class="hdr-actions">
      <a class="hdr-link" href="/reits">REITs 行情分析与横向对标 →</a>
      <span class="badge">数据仅当前页面留存</span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="code">A 股代码</button>
    <button class="tab" data-tab="upload">上传三大报表</button>
  </nav>

  <section id="panel-code" class="panel">
    <div class="card">
      <div class="field">
        <label for="code">6 位 A 股代码（当前支持沪深）</label>
        <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="例如 600519">
        <p id="code-name" class="hint"></p>
      </div>
      <div class="row">
        <div class="field">
          <label for="source">数据来源</label>
          <select id="source"></select>
        </div>
        <div class="field">
          <label for="periods">展示期数（最近 N 个年报）</label>
          <input id="periods" type="number" min="2" max="30" value="10">
        </div>
      </div>
      <button id="btn-code" class="primary">生成报告与图表</button>
    </div>
  </section>

  <section id="panel-upload" class="panel hidden">
    <div class="card">
      <div class="field">
        <label for="files">选择报表文件（xlsx / xls / csv，可多选，1-3 张）</label>
        <input id="files" type="file" multiple accept=".xlsx,.xls,.csv">
      </div>
      <div class="row">
        <div class="field">
          <label for="unit">金额单位（请按报表实际单位选择）</label>
          <select id="unit"></select>
        </div>
        <div class="field">
          <label for="up-periods">展示期数</label>
          <input id="up-periods" type="number" min="2" max="30" value="10">
        </div>
      </div>
      <button id="btn-upload" class="primary">上传并检查科目映射</button>
      <p class="hint">上传后先确认报表角色与科目映射，再生成报告。原始文件只保存在本次会话的临时目录，关闭页面即销毁。</p>
    </div>
    <div id="mapping" class="card hidden"></div>
  </section>

  <section id="result" class="hidden"></section>
  <div id="status" class="status"></div>

  <footer class="ftr">
    内部自用 · 确定性模板报告 · 报告仅供参考，不构成投资建议 · 上传数据未做外部核验
  </footer>
</div>
<script src="/static/app.js"></script>
</body>
</html>
